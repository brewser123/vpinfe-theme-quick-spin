<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>VPinFE - Backglass</title>
    <link rel="stylesheet" href="/web/common/vpinfe-style.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- VPinFE Core (must load first) -->
    <script src="/web/common/vpinfe-core.js"></script>

    <!-- Theme Modules (minimal set for BG window) -->
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/loading-image.js"></script>
    <script src="js/events.js"></script>
    <script src="js/bg-dmd-media.js"></script>
    <script src="js/bg-window.js"></script>

    <!-- Main initialization (must load last) -->
    <script src="theme.js"></script>
  </head>
  <body class="bg-screen">
    <div id="rootContainer"></div>
    <div id="fadeOverlay">
      <div id="loading-message" style="display: none">
        <div class="custom-loading-frame" hidden>
          <img class="custom-loading-image" alt="Custom loading image" />
        </div>
        <div class="default-loading">
          <div class="loading-spinner" aria-hidden="true"></div>
          <div class="loading-text">Quick Spin</div>
        </div>
        <div id="loading-table-name"></div>
      </div>
    </div>
    <div id="overlay-root"></div>
  </body>
</html>
